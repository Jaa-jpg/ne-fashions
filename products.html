<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NE Fashions — Products</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 240px;
      background: #222;
      color: #fff;
      padding: 25px 18px;
    }

    .brand {
      padding: 0 12px 30px;
    }

    .brand h1 {
      font-family: Georgia, serif;
      font-size: 24px;
    }

    .brand p {
      font-size: 12px;
      color: #aaa;
      margin-top: 5px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .menu button {
      width: 100%;
      border: none;
      background: transparent;
      color: #ddd;
      padding: 13px 12px;
      text-align: left;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .menu button:hover,
    .menu button.active {
      background: #333;
      color: #fff;
    }

    /* MAIN */

    .main {
      flex: 1;
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .topbar h2 {
      font-size: 26px;
    }

    .add-btn {
      background: #222;
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* FORM */

    .product-form {
      display: none;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .product-form.show {
      display: block;
    }

    .product-form h3 {
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 14px;
      outline: none;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .save-btn {
      background: #222;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 7px;
      cursor: pointer;
    }

    .cancel-btn {
      background: #eee;
      color: #222;
      border: none;
      padding: 12px 20px;
      border-radius: 7px;
      cursor: pointer;
    }

    /* COLORS */

    .color-section {
      margin-top: 20px;
    }

    .color-section h4 {
      margin-bottom: 10px;
      font-size: 14px;
    }

    .color-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .color-row input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 7px;
    }

    .remove-color {
      width: 40px;
      border: none;
      background: #eee;
      border-radius: 7px;
      cursor: pointer;
    }

    .add-color-btn {
      border: 1px solid #ddd;
      background: #fff;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    /* IMAGE PREVIEW */

    .image-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .image-preview-item {
      position: relative;
    }

    .image-preview-item img {
      width: 100px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      border: 1px solid #eee;
    }

    .remove-image {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 50%;
      background: #fff;
      color: #222;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      line-height: 20px;
    }

    /* TABLE */

    .table-box {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    th {
      font-size: 13px;
      color: #777;
      background: #fafafa;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
    }

    .active-status {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .inactive-status {
      background: #ffebee;
      color: #c62828;
    }

    .action-btn {
      border: 1px solid #ddd;
      background: #fff;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 5px;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: #888;
    }

    @media (max-width: 800px) {
      .sidebar {
        width: 200px;
      }

      .main {
        padding: 20px;
      }
    }

    @media (max-width: 650px) {
      .layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
      }

      .main {
        padding: 15px;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="brand">
      <h1>NE Fashions</h1>
      <p>Admin Panel</p>
    </div>

    <nav class="menu">

      <button onclick="window.location.href='admin-dashboard.html'">
        Dashboard
      </button>

      <button class="active">
        Products
      </button>

      <button onclick="window.location.href='orders.html'">
        Orders
      </button>

      <button onclick="window.location.href='customers.html'">
        Customers
      </button>

      <button onclick="window.location.href='coupons.html'">
        Coupons
      </button>

      <button onclick="window.location.href='reviews.html'">
        Reviews
      </button>

      <button onclick="window.location.href='store-settings.html'">
        Store Settings
      </button>

      <button onclick="adminLogout()">
        Logout
      </button>

    </nav>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <div class="topbar">

      <h2>Products</h2>

      <button class="add-btn" onclick="showProductForm()">
        + Add Product
      </button>

    </div>


    <!-- PRODUCT FORM -->

    <div class="product-form" id="productForm">

      <h3 id="productFormTitle">Add New Product</h3>


      <!-- PRODUCT NAME -->

      <div class="form-group">

        <label>Product Name</label>

        <input
          type="text"
          id="productName"
          placeholder="Enter product name"
        >

      </div>


      <!-- CATEGORY -->

      <div class="form-group">

        <label>Category</label>

        <select id="productCategory">

          <option value="">
            Select category
          </option>

        </select>

      </div>


      <!-- PRICE -->

      <div class="form-group">

        <label>Price</label>

        <input
          type="number"
          id="productPrice"
          placeholder="Enter price"
        >

      </div>


      <!-- MATERIAL -->

      <div class="form-group">

        <label>Material</label>

        <input
          type="text"
          id="productMaterial"
          placeholder="Example: Cotton"
        >

      </div>


      <!-- DESCRIPTION -->

      <div class="form-group">

        <label>Description</label>

        <textarea
          id="productDescription"
          placeholder="Enter product description"
        ></textarea>

      </div>


      <!-- COLORS -->

      <div class="color-section">

        <h4>Colors</h4>

        <div id="colorList"></div>

        <button
          type="button"
          class="add-color-btn"
          onclick="addColor()"
        >
          + Add Color
        </button>

      </div>


      <!-- ACTIONS -->

      <div class="form-actions">

        <button
          type="button"
          class="save-btn"
          onclick="saveProduct()"
        >
          Save Product
        </button>

        <button
          type="button"
          class="cancel-btn"
          onclick="hideProductForm()"
        >
          Cancel
        </button>

      </div>

    </div>


    <!-- PRODUCTS TABLE -->

    <div class="table-box">

      <table>

        <thead>

          <tr>
            <th>Product</th>
            <th>Images</th>
            <th>Colors</th>
            <th>Category</th>
            <th>Price</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>

        </thead>

        <tbody id="productsTableBody">

        </tbody>

      </table>

    </div>

  </main>

</div>


<script>

  /* SUPABASE */

  const SUPABASE_URL =
    "https://rcablyesxkzvxzolwvyz.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_7WueOf83yr4MDgHOz506iA_wGZ3uzcB";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* CHECK LOGIN */

  async function checkAdminLogin() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {

      window.location.href = "admin.html";

      return false;

    }

    return true;

  }


 /* SHOW FORM */

window.showProductForm = function () {

  document.getElementById("productFormTitle").textContent =
    "Add New Product";

  document
    .getElementById("productForm")
    .classList.add("show");

};


/* HIDE FORM */

window.hideProductForm = function () {

  document
    .getElementById("productForm")
    .classList.remove("show");

};


 /* LOAD PRODUCTS */

async function loadProducts() {

  const {
    data,
    error
  } = await supabaseClient

    .from("products")

    .select(`
      id,
      name,
      price,
      active,
      categories (
        name
      ),
      product_variants (
        id,
        color_name,
        product_images (
          id,
          image_url,
          sort_order,
          is_primary
        )
      )
    `)

    .order("id", {
      ascending: false
    });


  if (error) {

    console.error(
      "Products loading error:",
      error
    );

    return;

  }


  const tableBody =
    document.getElementById(
      "productsTableBody"
    );


  tableBody.innerHTML = "";


  if (!data || data.length === 0) {

    tableBody.innerHTML = `
      <tr>
        <td
          colspan="7"
          class="empty"
        >
          No products found.
        </td>
      </tr>
    `;

    return;

  }


  data.forEach(product => {

    const row =
      document.createElement("tr");


    /* GET COLORS */

    const colors =
      product.product_variants || [];


    const colorNames =
      colors
        .map(color => color.color_name)
        .filter(Boolean);


    /* GET ALL IMAGES */

    const images =
      colors.flatMap(
        color =>
          color.product_images || []
      );


    images.sort(
      (a, b) =>
        (a.sort_order ?? 0) -
        (b.sort_order ?? 0)
    );


    /* IMAGE HTML */

    let imageHTML = "";


    if (images.length > 0) {

      imageHTML = `
        <div style="
          display:flex;
          gap:6px;
          flex-wrap:wrap;
          align-items:center;
        ">
      `;


      images.forEach(image => {

        imageHTML += `
          <img
            src="${image.image_url}"
            alt="Product image"
            style="
              width:55px;
              height:65px;
              object-fit:cover;
              border-radius:6px;
              border:1px solid #eee;
              display:block;
            "
          >
        `;

      });


      imageHTML += `
        </div>
      `;

    }


    /* COLORS HTML */

    const colorsHTML =
      colorNames.length > 0
        ? colorNames.join(", ")
        : "No colors";


    /* ROW HTML */

    row.innerHTML = `

      <td>
        ${product.name || "-"}
      </td>

      <td>
        ${imageHTML}
      </td>

      <td>
        ${colorsHTML}
      </td>

      <td>
        ${product.categories?.name || "-"}
      </td>

      <td>
        ₹${product.price ?? 0}
      </td>

      <td>

        <span class="status ${
          product.active
            ? "active-status"
            : "inactive-status"
        }">

          ${
            product.active
              ? "Active"
              : "Inactive"
          }

        </span>

      </td>

      <td>

        <button
          class="action-btn"
          onclick="editProduct(${product.id})"
        >
          Edit
        </button>

        <button
          class="action-btn"
          onclick="deleteProduct(${product.id})"
        >
          Delete
        </button>

      </td>

    `;


    tableBody.appendChild(row);

  });

}


  /* LOAD CATEGORIES */

  async function loadCategories() {

    const {
      data,
      error
    } = await supabaseClient

      .from("categories")

      .select("id, name")

      .eq("active", true)

      .order("name");


    if (error) {

      console.error(
        "Categories loading error:",
        error
      );

      return;

    }


    const categorySelect =
      document.getElementById(
        "productCategory"
      );


    categorySelect.innerHTML =
      `
        <option value="">
          Select category
        </option>
      `;


    data.forEach(category => {

      categorySelect.innerHTML += `

        <option value="${category.id}">
          ${category.name}
        </option>

      `;

    });

  }


  function addColor() {

  const colorList =
    document.getElementById("colorList");

  const colorRow =
    document.createElement("div");

  colorRow.className = "color-row";

  colorRow.innerHTML = `

    <div style="flex:1;">

     <div style="position:relative;">

  <input
    type="text"
    placeholder="Enter color name"
    class="color-name"
    style="width:100%;"
  >

  <button
    type="button"
    class="remove-color-small"
    style="
      position:absolute;
      right:6px;
      top:50%;
      transform:translateY(-50%);
      border:none;
      background:#fff;
      color:#888;
      font-size:14px;
      cursor:pointer;
      padding:0 4px;
      line-height:1;
    "
  >
    ×
  </button>

</div>

      <input
        type="file"
        accept="image/*"
        multiple
        class="color-images"
        style="display:none;"
      >

      <button
        type="button"
        class="add-color-btn"
        style="margin-top:8px;"
        onclick="this.previousElementSibling.click()"
      >
        + Add Images
      </button>

      <div
        class="color-image-preview image-preview"
      ></div>

    </div>

  `;

  colorList.appendChild(colorRow);

  const imageInput =
    colorRow.querySelector(".color-images");

  const preview =
    colorRow.querySelector(".color-image-preview");

   colorRow
  .querySelector(".remove-color-small")
  .addEventListener("click", function () {

    if (colorRow.dataset.variantId) {

      if (!window.removedVariantIds) {
        window.removedVariantIds = [];
      }

      window.removedVariantIds.push(
        Number(colorRow.dataset.variantId)
      );

    }

    colorRow.remove();

  });

  
    colorRow.colorFiles = [];

imageInput.addEventListener("change", function () {

  colorRow.colorFiles.push(
    ...Array.from(this.files)
  );

  preview.innerHTML = "";

  colorRow.colorFiles.forEach(file => {

    const reader =
      new FileReader();

    reader.onload =
      function(event) {

        const wrapper =
          document.createElement("div");

        wrapper.className =
          "image-preview-item";

       wrapper.innerHTML = `

  <img
    src="${event.target.result}"
    alt="Color image"
  >

  <button
    type="button"
    class="remove-image-small"
    style="
      position:absolute;
      top:3px;
      right:3px;
      width:18px;
      height:18px;
      border:none;
      border-radius:50%;
      background:rgba(255,255,255,0.9);
      color:#777;
      font-size:13px;
      line-height:16px;
      padding:0;
      cursor:pointer;
    "
  >
    ×
  </button>

`;

        preview.appendChild(wrapper);

        wrapper
  .querySelector(".remove-image-small")
  .addEventListener("click", function () {

    const index =
      colorRow.colorFiles.indexOf(file);

    if (index !== -1) {
      colorRow.colorFiles.splice(index, 1);
    }

    wrapper.remove();

  });

      };

    reader.readAsDataURL(file);

  });

  /*
    Clear input so the same
    Add Images button can be
    used again.
  */

  this.value = "";

   });
}


  /* SAVE PRODUCT */

  async function saveProduct() {
      if (window.editingProductId) {
    await updateProduct(window.editingProductId);
    return;
  }

    const name =
      document
        .getElementById("productName")
        .value
        .trim();


    const categoryId =
      document
        .getElementById("productCategory")
        .value;


    const price =
      document
        .getElementById("productPrice")
        .value;


    const material =
      document
        .getElementById("productMaterial")
        .value
        .trim();


    const description =
      document
        .getElementById("productDescription")
        .value
        .trim();


    if (
      !name ||
      !categoryId ||
      !price
    ) {

      alert(
        "Please enter product name, category and price."
      );

      return;

    }


    const {
      data: product,
      error: productError
    } = await supabaseClient

      .from("products")

      .insert({

        name: name,

        category_id:
          Number(categoryId),

        price:
          Number(price),

        material:
          material,

        description:
          description,

        active:
          true

      })

      .select()

      .single();


    if (productError) {

      console.error(
        "Product save error:",
        productError
      );

      alert(
        "Product could not be saved."
      );

      return;

    }


    /*
  SAVE COLORS + COLOR IMAGES
*/

const colorRows =
  document.querySelectorAll(".color-row");


for (const row of colorRows) {

  const colorInput =
    row.querySelector(".color-name");

  const imageInput =
    row.querySelector(".color-images");


  const colorName =
    colorInput.value.trim();


  if (!colorName) {
    continue;
  }


  /* SAVE COLOR */

  const {
    data: variant,
    error: variantError
  } = await supabaseClient

    .from("product_variants")

    .insert({

      product_id:
        product.id,

      color_name:
        colorName,

      active:
        true

    })

    .select()
    .single();


  if (variantError) {

    console.error(
      "Color save error:",
      variantError
    );

    alert(
      "Product saved, but color could not be saved.\n\n" +
      "Error: " + variantError.message
    );

    return;

  }


  /* UPLOAD IMAGES FOR THIS COLOR */

  const files =
  row.colorFiles || [];


  for (
    let i = 0;
    i < files.length;
    i++
  ) {

    const file =
      files[i];


    const fileName =
      `${Date.now()}-${Math.random()
        .toString(36)
        .substring(2)}-${file.name}`;


    const filePath =
      `${product.id}/${variant.id}/${fileName}`;


    /* UPLOAD IMAGE */

    const {
      error: uploadError
    } = await supabaseClient

      .storage

      .from("product-images")

      .upload(
        filePath,
        file
      );


    if (uploadError) {

      console.error(
        "Image upload error:",
        uploadError
      );

      alert(
        "Color saved, but image upload failed.\n\n" +
        "Error: " + uploadError.message
      );

      return;

    }


    /* GET IMAGE URL */

    const {
      data: publicUrlData
    } = supabaseClient

      .storage

      .from("product-images")

      .getPublicUrl(
        filePath
      );


    const imageUrl =
      publicUrlData.publicUrl;


    /* SAVE IMAGE IN DATABASE */

    const {
      error: imageError
    } = await supabaseClient

      .from("product_images")

      .insert({

        variant_id:
          variant.id,

        image_url:
          imageUrl,

        sort_order:
          i,

        is_primary:
          i === 0

      });


    if (imageError) {

      console.error(
        "Product image save error:",
        imageError
      );

      alert(
        "Image uploaded, but image record could not be saved.\n\n" +
        "Error: " + imageError.message
      );

      return;

    }

  }

}


    /* CLEAR FORM */

    document
      .getElementById("productName")
      .value = "";


    document
      .getElementById("productCategory")
      .value = "";


    document
      .getElementById("productPrice")
      .value = "";


    document
      .getElementById("productMaterial")
      .value = "";


    document
      .getElementById("productDescription")
      .value = "";


    document
      .getElementById("colorList")
      .innerHTML = "";

    hideProductForm();


    loadProducts();

  }


  /* DELETE PRODUCT */

async function deleteProduct(productId) {

  const confirmDelete = confirm(
    "Are you sure you want to delete this product?"
  );

  if (!confirmDelete) return;

  try {

    /* 1. Get variants */

    const { data: variants, error: variantError } =
      await supabaseClient
        .from("product_variants")
        .select("id")
        .eq("product_id", productId);

    if (variantError) {
      console.error("Variant fetch error:", variantError);
      alert("Could not find product variants.");
      return;
    }

    const variantIds =
      (variants || []).map(v => v.id);


    /* 2. Delete product images records */

    if (variantIds.length > 0) {

      const { error: imageError } =
        await supabaseClient
          .from("product_images")
          .delete()
          .in("variant_id", variantIds);

      if (imageError) {
        console.error("Image delete error:", imageError);
        alert("Could not delete product images.");
        return;
      }


      /* 3. Delete variants */

      const { error: deleteVariantError } =
        await supabaseClient
          .from("product_variants")
          .delete()
          .eq("product_id", productId);

      if (deleteVariantError) {
        console.error(
          "Variant delete error:",
          deleteVariantError
        );

        alert("Could not delete product colors.");
        return;
      }
    }


    /* 4. Delete product */

    const { error: productError } =
      await supabaseClient
        .from("products")
        .delete()
        .eq("id", productId);

    if (productError) {

      console.error(
        "Product delete error:",
        productError
      );

      alert(
        "Product could not be deleted.\n\n" +
        productError.message
